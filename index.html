<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LIFE TOUCH — Healthy Choice. Better Life.</title>
<style>
:root{--p:#5B21B6;--r:#7C3AED;--e:#8B5CF6;--l:#A78BFA;--s:#EDE9FE;--bg:#F8F7FC;--d:#111827;--t:#1F2937;--m:#6B7280;--w:#fff;--ok:#16A34A;--bad:#DC2626;--bd:#E5E1F2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--t);background:var(--w);line-height:1.55}
a{color:inherit;text-decoration:none}h1,h2,h3{line-height:1.15;margin:0 0 .5em;color:var(--d)}
:focus-visible{outline:3px solid var(--e);outline-offset:2px}
.wrap{max-width:1180px;margin:auto;padding:0 20px}.sec{padding:80px 0}.alt{background:var(--bg)}
.eyebrow{color:var(--r);font-weight:700;letter-spacing:.14em;font-size:.78rem;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:12px;border:1px solid var(--r);background:var(--r);color:#fff;font-weight:700;font-size:.9rem;letter-spacing:.04em;cursor:pointer;transition:.2s}
.btn:hover{background:var(--p);transform:translateY(-1px);box-shadow:0 8px 20px rgba(91,33,182,.25)}
.btn.o{background:#fff;color:var(--p);border-color:var(--bd)}.btn.o:hover{background:var(--s)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}.btn.full{width:100%}.btn.sm{min-height:38px;padding:0 14px}
.card{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:24px;box-shadow:0 1px 2px rgba(17,24,39,.04),0 8px 24px rgba(91,33,182,.05)}
.grid{display:grid;gap:20px}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.g5{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.ic{width:46px;height:46px;border-radius:13px;background:var(--s);color:var(--p);display:grid;place-items:center;margin-bottom:14px}.ic svg{width:22px;height:22px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
header.nav{position:sticky;top:0;z-index:50;background:#fff;transition:.25s;border-bottom:1px solid transparent}header.nav.sc{box-shadow:0 6px 24px rgba(17,24,39,.08);border-color:var(--bd)}
.nav .wrap{display:flex;align-items:center;gap:24px;height:72px}.logo{height:46px;width:auto;display:block}
.nav nav{display:flex;gap:6px;margin-left:auto;align-items:center}.nav nav a{padding:8px 12px;border-radius:10px;font-weight:600;font-size:.92rem;color:var(--t)}.nav nav a:hover,.nav nav a.on{background:var(--s);color:var(--p)}
.burger{display:none;margin-left:auto;background:none;border:1px solid var(--bd);border-radius:10px;width:44px;height:44px;font-size:1.3rem;cursor:pointer}
@media(max-width:900px){.burger{display:block}.nav nav{display:none;position:absolute;top:72px;left:0;right:0;background:#fff;flex-direction:column;align-items:stretch;padding:14px 20px 20px;border-bottom:1px solid var(--bd);box-shadow:0 18px 30px rgba(0,0,0,.08)}.nav nav.open{display:flex}}
.hero{background:radial-gradient(900px 500px at 85% 20%,rgba(139,92,246,.18),transparent 60%),linear-gradient(180deg,var(--bg),#fff);padding:72px 0 88px}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}@media(max-width:900px){.hero .wrap{grid-template-columns:1fr}}
.hero h1{font-size:clamp(2.3rem,5.5vw,4rem);letter-spacing:-.02em}.hero h1 span{color:var(--r)}.hero p.lead{font-size:1.1rem;color:var(--m);max-width:520px;margin:18px 0 28px}
.stage{position:relative;aspect-ratio:1;max-width:470px;width:100%;margin:auto;display:grid;place-items:center}
.stage .lg{width:56%;position:relative;z-index:3;opacity:0;animation:lgin .9s .1s ease forwards}
.aura{position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.35),rgba(139,92,246,0) 70%);opacity:0;animation:fade 1.2s .9s forwards,pulse 5s 2.2s ease-in-out infinite}
.ring{position:absolute;inset:6%;border-radius:50%;border:1.5px solid rgba(124,58,237,.35);transform:scale(.6);opacity:0;animation:ringin 1.1s .5s ease forwards,spin 40s 1.6s linear infinite}
.ring.b{inset:-1%;border-style:dashed;border-color:rgba(167,139,250,.5);animation-delay:.7s,1.8s;animation-direction:normal,reverse}
.ring i{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--e);top:-4px;left:50%;box-shadow:0 0 10px var(--e)}
.pt{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--l);opacity:0;animation:fl 6s ease-in-out infinite,fade .8s 1.3s forwards}
@keyframes lgin{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}@keyframes fade{to{opacity:1}}@keyframes ringin{to{transform:scale(1);opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.06)}}@keyframes fl{50%{transform:translateY(-14px)}}
.view{animation:vin .32s ease}@keyframes vin{from{opacity:0;transform:translateY(10px)}}
.pk{position:relative;display:flex;flex-direction:column}.pk.f{border:2px solid var(--r)}.pk .pr{font-size:2rem;font-weight:800;color:var(--d)}.pk ul{list-style:none;padding:0;margin:14px 0 22px;flex:1}.pk li{padding:6px 0 6px 26px;position:relative;font-size:.92rem}.pk li:before{content:"✓";position:absolute;left:0;color:var(--r);font-weight:700}
.badge{display:inline-block;background:var(--s);color:var(--p);padding:3px 10px;border-radius:99px;font-size:.72rem;font-weight:700;letter-spacing:.06em}
.ph{aspect-ratio:4/3;border-radius:14px;background:linear-gradient(135deg,#fff,var(--s));border:1px dashed var(--l);display:grid;place-items:center;color:var(--r);font-size:2.4rem;margin-bottom:14px}
.step b{font-size:3rem;color:var(--s);-webkit-text-stroke:1.5px var(--l);display:block;line-height:1}
details{border:1px solid var(--bd);border-radius:14px;padding:16px 20px;background:#fff;margin-bottom:12px}summary{font-weight:700;cursor:pointer;color:var(--d)}details p{color:var(--m);margin:.6em 0 0}
.cta{background:linear-gradient(135deg,#2a1065,var(--p));color:#fff;text-align:center;border-radius:28px;padding:64px 24px}.cta h2{color:#fff;font-size:clamp(1.6rem,4vw,2.6rem)}.cta p{color:#DDD6FE}.cta .btn{background:#fff;color:var(--p);border-color:#fff}
footer{background:var(--d);color:#CBD5E1;padding:56px 0 24px}footer .logo{height:56px;filter:none}footer h4{color:#fff;font-size:.8rem;letter-spacing:.14em;margin:0 0 12px}footer a{display:block;padding:4px 0;color:#A8B0C0;font-size:.92rem}footer a:hover{color:#fff}.foot{display:grid;grid-template-columns:1.6fr repeat(4,1fr);gap:28px}@media(max-width:900px){.foot{grid-template-columns:1fr 1fr}}.copy{border-top:1px solid #2a3344;margin-top:36px;padding-top:20px;font-size:.84rem}
.auth{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 72px)}.auth .brand{background:linear-gradient(160deg,#2a1065,var(--p) 60%,var(--r));color:#fff;display:grid;place-items:center;padding:40px;text-align:center}.auth .brand h2{color:#fff;font-size:2rem}.auth .brand p{color:#DDD6FE}.auth .brand .logo{height:auto;width:min(300px,70%);margin:0 auto 24px;background:#fff;border-radius:24px;padding:16px}.auth .form{display:grid;place-items:center;padding:32px 20px}.auth .card{width:100%;max-width:460px;padding:32px}@media(max-width:900px){.auth{grid-template-columns:1fr}.auth .brand{display:none}}
label{display:block;font-weight:600;font-size:.86rem;margin:14px 0 6px}input,select,textarea{width:100%;min-height:46px;padding:10px 14px;border:1px solid var(--bd);border-radius:12px;font:inherit;background:#fff;color:var(--t)}input:focus,select:focus,textarea:focus{border-color:var(--e);outline:3px solid rgba(139,92,246,.2)}
.err{color:var(--bad);font-size:.8rem;min-height:1em;margin-top:4px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.sb{justify-content:space-between}.chk{display:flex;gap:8px;align-items:center;font-weight:500;margin:14px 0}.chk input{width:18px;min-height:18px}
.meter{height:6px;background:var(--s);border-radius:9px;overflow:hidden;margin-top:8px}.meter i{display:block;height:100%;width:0;background:var(--bad);transition:.3s}
.ov{position:fixed;inset:0;z-index:99;background:rgba(255,255,255,.96);display:grid;place-items:center;text-align:center;animation:fade .25s both}.ov .sp{position:relative;width:150px;height:150px;margin:0 auto 16px;display:grid;place-items:center}.ov .sp img{width:78px;position:relative}.ov .sp:before{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--s);border-top-color:var(--r);animation:spin 1s linear infinite}.ov h3{letter-spacing:.1em;color:var(--p)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--d);color:#fff;padding:12px 20px;border-radius:12px;z-index:120;font-size:.9rem;animation:vin .3s}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh;background:var(--bg)}
.side{background:#fff;border-right:1px solid var(--bd);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.side .me{background:var(--s);border-radius:14px;padding:12px 14px;margin:10px 0 14px;font-size:.84rem;color:var(--m)}.side .me b{display:block;color:var(--d);font-size:1rem}
.side a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;font-weight:600;font-size:.9rem;color:var(--t)}.side a svg{color:var(--r)}.side a:hover{background:var(--s)}.side a.on{background:var(--r);color:#fff}.side a.on svg{color:#fff}
.main{padding:0 28px 40px;min-width:0}.top{display:flex;align-items:center;gap:14px;height:72px}.top h1{font-size:1.5rem;margin:0}.top .rc{margin-left:auto;font-size:.85rem;color:var(--m)}.top .rc b{color:var(--p);font-family:ui-monospace,monospace}
.mb{display:none;background:#fff;border:1px solid var(--bd);border-radius:10px;width:44px;height:44px;font-size:1.2rem;cursor:pointer}.scrim{display:none}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:fixed;z-index:80;left:0;width:280px;transform:translateX(-100%);transition:.25s}.side.open{transform:none}.scrim.on{display:block;position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:70}.mb{display:block}.main{padding:0 16px 32px}.top .rc span{display:none}}
.stat small{color:var(--m);font-weight:600;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}.stat .v{font-size:1.8rem;font-weight:800;color:var(--d);margin:6px 0 2px}.stat p{margin:0;color:var(--m);font-size:.8rem}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:14px;background:#fff}table{width:100%;border-collapse:collapse;min-width:520px}th{text-align:left;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--m);padding:12px 16px;background:var(--bg)}
.es{text-align:center;padding:44px 20px}.es .ic{margin:0 auto 14px;width:60px;height:60px;border-radius:18px}.es .ic svg{width:28px;height:28px}.es h3{font-size:1rem;letter-spacing:.08em;margin-bottom:6px}.es p{color:var(--m);margin:0 auto 14px;max-width:380px;font-size:.92rem}
.tree{display:flex;flex-direction:column;align-items:center;padding:20px 0}.node{border:2px solid var(--r);background:#fff;border-radius:16px;padding:14px 26px;text-align:center;font-weight:800;color:var(--p)}.node small{display:block;font-weight:600;color:var(--m)}.node.em{border:2px dashed var(--l);color:var(--m);font-size:.78rem;letter-spacing:.1em;padding:18px 18px;min-width:130px}
.lines{width:min(300px,70%);height:40px;border:2px solid var(--l);border-bottom:0;border-radius:14px 14px 0 0;margin-top:20px;position:relative}.lines:before{content:"";position:absolute;left:50%;top:-22px;height:20px;border-left:2px solid var(--l)}.kids{display:flex;gap:min(110px,14vw);margin-top:0}
.sub{margin-top:24px}.sub h3{font-size:.95rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
.chat{min-height:240px}.msgs{min-height:200px}.pg{text-align:center;padding:100px 20px}.pg h1{font-size:4rem;color:var(--r)}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.stage .lg,.aura,.ring,.pt{opacity:1;transform:none}.view{animation:vin .2s}}
</style></head>

upgrade:u=>`<div class="card row sb"><div><small class="eyebrow">CURRENT MEMBERSHIP</small><h2 style="margin:4px 0 0">${u.tier}</h2></div><div style="text-align:right"><small style="color:var(--m)">Wallet Balance</small><div style="font-weight:800;font-size:1.4rem">${peso}</div></div></div><div class="sub grid g3">${PK.slice(1).map(p=>`<article class="card pk"><h3>${p[0]}</h3><div class="pr">${p[1]}</div><ul>${p[3].map(f=>`<li>${f}</li>`).join("")}</ul><button class="btn" onclick="toast('Upgrades are authorised server-side once the backend is connected.')">Upgrade to ${p[0]}</button></article>`).join("")}</div>`,
deposits:u=>`<div class="card stat"><small>Wallet Balance</small><div class="v">${bal}</div></div><div class="sub"><h3>Submit Deposit</h3>${wForm("dep",sel("pm","Payment Method",["Bank Transfer","E-Wallet"])+fld("am","Amount","number",'min="1" step="0.01" required')+`<label for="pf">Proof of Payment</label><input id="pf" name="pf" type="file" accept=".jpg,.jpeg,.png,.pdf" required><small style="color:var(--m)">JPG, PNG or PDF, max 5 MB. Files are renamed and stored server-side.</small><div class="err"></div>`,"Submit Deposit")}</div><div class="sub"><h3>History</h3>${tbl(["Date","Method","Amount","Status"],es("dl","NO DEPOSITS YET","Submitted deposits will appear here."))}</div>`,
withdrawals:u=>`<div class="card stat"><small>Wallet Balance</small><div class="v">${bal}</div></div><div class="sub"><h3>Request Withdrawal</h3>${wForm("wd",fld("wn","FULL NAME","text",'autocomplete="name" required')+fld("gc","GCASH NUMBER","tel",'inputmode="numeric" placeholder="09XXXXXXXXX" required')+fld("am","WITHDRAWAL AMOUNT (₱)","number",'min="1" step="0.01" required')+'<div class="err fe" role="alert"></div>',"Submit Withdrawal")}</div><div class="sub"><h3>History</h3>${tbl(["Date","Method","Amount","Status"],es("ul","NO WITHDRAWALS YET","Withdrawal requests will appear here."))}</div>`,
orders:u=>`${tbl(["Order","Items","Payment","Total","Status"],es("box","YOU HAVE NOT PLACED ANY ORDERS YET","Visit the shop when products become available.",'<a class="btn" href="#/member/shop">Go to Shop</a>'))}`,
profile:u=>`<div class="grid g2"><div class="card"><h3>Account</h3>${[["Email",u.email],["Membership",u.tier],["Member Since",u.since],["Referral Code",u.code]].map(r=>`<div class="row sb" style="padding:10px 0;border-bottom:1px solid var(--bd)"><span style="color:var(--m)">${r[0]}</span><b>${r[1]}</b></div>`).join("")}</div>${wForm("prof",`<h3>My Details</h3>`+fld("fn","Full Name","text",`value="${u.name}" required`)+fld("mb","Mobile Number","tel",`value="${u.mobile||""}"`),"Save Details")}</div>`,
support:u=>`<div class="card chat"><h3>LIFE TOUCH SUPPORT</h3><div class="msgs" id="msgs">${es("chat","NO MESSAGES YET","Send your concern and our support team will get back to you.")}</div><form data-f="chat" class="row" novalidate><input name="m" aria-label="Message" placeholder="Type your concern here..." maxlength="500" style="flex:1;min-width:200px"><button class="btn">SEND</button></form></div>`,
shop:u=>pages["/shop"]().replace(/^[\s\S]*?<main class="view">/,"").replace(/<\/main>[\s\S]*$/,"")
};
const TITLES=Object.fromEntries(NAV.map(n=>[n[2],n[0]]));TITLES["pairing-wallet"]="LIFE TOUCH WALLET";TITLES.genealogy="GENEALOGY TREE";TITLES.orders="MY ORDERS";TITLES.support="LIFE TOUCH SUPPORT";
function memberPage(k,u){bal=fmtP(u.balance);const body=(M[k]||M.dashboard)(u);return`<div class="app"><aside class="side" id="sd" aria-label="Member navigation">${img()}<div class="me">Welcome back,<b>${u.name}</b>Membership: ${u.tier}</div>${NAV.map(n=>`<a href="#/member/${n[2]}" class="${n[2]===k?"on":""}">${ic(n[1])}${n[0]}</a>`).join("")}<a href="#/logout" style="margin-top:auto">${ic("out")}Logout</a></aside><div class="scrim" id="sc" onclick="drawer(0)"></div><div class="main"><div class="top"><button class="mb" aria-label="Open menu" onclick="drawer(1)">☰</button><h1>${TITLES[k]||"Dashboard"}</h1><div class="rc"><span>Referral Code: </span><b>${u.code}</b></div></div><div class="view">${body}</div></div></div>`}
/* ---------- router ---------- */
async function route(){const h=(location.hash||"#/").slice(1).split("?")[0]||"/";let html;
if(h==="/logout"){overlay("SIGNING OUT...",900,()=>{fetch("/api/logout",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"}).finally(()=>{location.hash="#/login"})});return}
if(h.startsWith("/admin")){html=errPg("403","ACCESS DENIED","Only authorised staff can open this area.","Back to Home","/")}
else if(h.startsWith("/member/")){const u=await me();if(!u)html=errPg("401","SESSION EXPIRED","Please sign in again to continue.","SIGN IN","/login");else html=memberPage(h.split("/")[2],u)}
else if(h.startsWith("/shop/product"))html=pages["/shop/product"]();
else if(pages[h])html=pages[h]();
else if(h==="/500"||h==="/network")html=errPg(h==="/500"?"500":"OFFLINE",h==="/500"?"SOMETHING WENT WRONG":"NETWORK ERROR","Please try again in a moment.","Home","/");
else html=errPg("404","PAGE NOT FOUND","The page you're looking for doesn't exist.","Back to Home","/");
$("#app").innerHTML=html;scrollTo(0,0);document.title=NAME+" — Healthy Choice. Better Life.";bind()}
function menu(b){const n=$("#nv");const o=n.classList.toggle("open");b.setAttribute("aria-expanded",o)}
function drawer(o){$("#sd").classList.toggle("open",!!o);$("#sc").classList.toggle("on",!!o)}
function meter(el){const v=el.value;let s=0;if(v.length>=10)s++;if(/[A-Z]/.test(v)&&/[a-z]/.test(v))s++;if(/\d/.test(v))s++;if(/[^A-Za-z0-9]/.test(v))s++;const i=el.parentNode.querySelector(".meter i");i.style.width=s*25+"%";i.style.background=["#DC2626","#DC2626","#F59E0B","#16A34A","#16A34A"][s];$("#ml").textContent=["Minimum 10 characters","Weak","Fair","Good","Strong"][s]}
const V={required:(v)=>v.trim()?"":"This field is required.",email:v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)?"":"Enter a valid email address.",pw:v=>v.length>=10?"":"Use at least 10 characters.",ph:v=>/^[+\d][\d\s-]{6,16}$/.test(v)?"":"Enter a valid mobile number."};
let bal="₱0.00";
const fmtP=n=>"₱"+(n/100).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});
async function api(p,b){try{const r=await fetch("/api/"+p,{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify(b||{})});const j=await r.json().catch(()=>({}));return {ok:r.ok,...j}}catch(e){return {ok:false,error:"Network error. Please try again."}}}
async function me(){try{const r=await fetch("/api/me",{credentials:"same-origin"});return r.ok?await r.json():null}catch(e){return null}}
async function busy(f,fn){const b=f.querySelector("button:not([type=button])");if(b.disabled)return;b.disabled=true;try{await fn()}finally{b.disabled=false}}
const fe=(f,m)=>{const x=f.querySelector(".fe");if(x)x.textContent=m};
const verifyHTML=e=>`<h1 style="font-size:1.5rem">VERIFY YOUR GMAIL</h1><p style="color:var(--m)">We sent a 6-digit code from LIFE TOUCH GLOBAL to <b>${e.replace(/[<>&"]/g,"")}</b>.</p>${fld("otp","VERIFICATION CODE *","text",'inputmode="numeric" maxlength="6" autocomplete="one-time-code" required')}<div class="err fe" role="alert"></div><button class="btn full" style="margin-top:12px">VERIFY &amp; CREATE ACCOUNT</button>`;
const txT=u=>u.tx&&u.tx.length?`<div class="tw"><table><thead><tr><th scope="col">Date</th><th scope="col">Type</th><th scope="col">Amount</th></tr></thead><tbody>${u.tx.map(t=>`<tr><td style="padding:12px 16px">${t.date}</td><td style="padding:12px 16px">${t.type}</td><td style="padding:12px 16px">${t.amount<0?"-":""}${fmtP(Math.abs(t.amount))}</td></tr>`).join("")}</tbody></table></div>`:tbl(["Date","Type","Amount","Status"],es("doc","NO TRANSACTIONS YET","Wallet activity will be listed here."));
V.gm=v=>/^[a-z0-9][a-z0-9._+-]*@gmail\.com$/i.test(v.trim())?"":"Enter a valid Gmail address.";
function bind(){document.querySelectorAll("form[data-f]").forEach(f=>f.addEventListener("submit",ev=>{ev.preventDefault();const k=f.dataset.f,d=Object.fromEntries(new FormData(f));let ok=true;
const chk=(n,fn)=>{const el=f.elements[n];if(!el)return;const m=fn(el.value||"",el);const e=el.closest("div")&&el.parentNode.querySelector(`#${el.id} ~ .err, #${el.id} ~ small ~ .err`)||el.nextElementSibling;let er=f.querySelectorAll(".err");er=[...er].find(x=>el.compareDocumentPosition(x)&4);if(er)er.textContent=m;el.setAttribute("aria-invalid",!!m);if(m)ok=false};
const req=n=>chk(n,v=>V.required(v));
if(k==="login"){chk("e",v=>V.required(v)||V.gm(v));chk("c",v=>/^[A-Z0-9]{5}$/.test(v.trim().toUpperCase())?"":"Enter your 5-character referral code.");if(ok)busy(f,async()=>{const r=await api("login",{email:d.e,code:d.c.trim().toUpperCase()});if(!r.ok)return fe(f,r.error||"Sign in failed.");overlay("AUTHENTICATING...",700,()=>overlay("WELCOME TO LIFE TOUCH",900,()=>{location.hash="#/member/dashboard"}))})}
else if(k==="reg"){req("fn");req("ln");chk("e",v=>V.required(v)||V.gm(v));chk("c",v=>/^(?=.*[A-Z])(?=.*[0-9])[A-Z0-9]{5}$/.test(v.trim().toUpperCase())?"":"Invalid referral code. Please enter a valid 5-character referral code.");if(ok)busy(f,async()=>{const r=await api("register/start",{first:d.fn,last:d.ln,email:d.e,code:d.c.trim().toUpperCase()});if(!r.ok)return fe(f,r.error);f.dataset.f="verify";f.dataset.rid=r.rid;f.innerHTML=verifyHTML(d.e)})}
else if(k==="verify"){chk("otp",v=>/^\d{6}$/.test(v.trim())?"":"Enter the 6-digit code.");if(ok)busy(f,async()=>{const r=await api("register/verify",{rid:f.dataset.rid,otp:d.otp.trim()});if(!r.ok)return fe(f,r.error);overlay("CREATING YOUR LIFE TOUCH ACCOUNT...",1000,()=>overlay("ACCOUNT CREATED SUCCESSFULLY",1000,()=>{location.hash="#/member/dashboard"}))})}
else if(k==="forgot"){chk("e",v=>V.required(v)||V.email(v));if(ok){toast("If that email exists, a reset link has been sent.");f.reset()}}
else if(k==="track"){req("on");if(ok)toast("No order found with that number.")}
else if(k==="contact"){req("n");chk("e",v=>V.required(v)||V.email(v));req("m");if(ok){toast("Message ready. Connect a backend to deliver it.");f.reset()}}
else if(k==="dep"){req("pm");chk("am",v=>+v>0?"":"Enter an amount.");chk("pf",(v,el)=>{const x=el.files[0];if(!x)return"Proof of payment is required.";if(!/\.(jpe?g|png|pdf)$/i.test(x.name)||!/^(image\/(jpeg|png)|application\/pdf)$/.test(x.type))return"Only JPG, PNG or PDF files.";return x.size>5242880?"File exceeds 5 MB.":""});if(ok)toast("Demo only: deposits are verified server-side.")}
else if(k==="wd"){req("wn");chk("gc",v=>/^(09|\+639)\d{9}$/.test(v.replace(/[\s-]/g,""))?"":"Enter a valid GCash number.");chk("am",v=>+v>0?"":"Enter an amount.");if(ok)busy(f,async()=>{const r=await api("withdraw",{name:d.wn,gcash:d.gc,amount:d.am});if(!r.ok)return fe(f,r.error);toast("Withdrawal request submitted.");route()})}
else if(k==="prof"){req("fn");if(ok)toast("Details saved.")}
else if(k==="pw"){req("cp");chk("np",v=>V.pw(v));chk("cn",v=>v!==f.elements.np.value?"Passwords do not match.":"");if(ok){toast("Password updated.");f.reset()}}
else if(k==="chat"){const t=f.elements.m.value.trim();if(t){const m=$("#msgs");if(m.querySelector(".es"))m.innerHTML="";const p=document.createElement("p");p.style.cssText="background:var(--s);padding:10px 14px;border-radius:12px;margin:6px 0 6px auto;max-width:80%";p.textContent=t;m.appendChild(p);f.reset()}}
}))}
addEventListener("hashchange",route);addEventListener("scroll",()=>{const n=$("#nav");n&&n.classList.toggle("sc",scrollY>8)},{passive:true});
overlay("Loading your experience...",600,route,"LIFE TOUCH");
</script></body></html>
